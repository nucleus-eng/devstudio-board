version: 1
project:
  banner: banner-devcells.webp
  # Candidate title from the platemap Experiment column:
  # "EsaO-mNG / [EsaO]2-mNG EsaR titration +/- AHSL" and
  # "EsaO-mNG / [EsaO]2-mNG DNA template titration +/- AHSL" — QC to confirm.
  # No Specification table exists in any of the five source logs.
  title: 'Quorum Sensing in Nucleus Cytosol using EsaO/EsaR Transcriptional Regulation'
  description: >
    EsaR(D91G) repression of single- and dual-operator EsaO-mNG sensor
    constructs in Nucleus Cytosol, across five days: an EsaR titration at
    fixed sensor DNA, a sensor DNA titration at fixed EsaR, a repeat of that
    titration with EsaR pre-expressed overnight, a magnesium sweep with EsaR
    and DNA pre-incubated before the reaction, and an EsaR DNA template
    competition assay.
