  # Candidate title from the platemap Experiment column:
  # "EsaO-mNG / [EsaO]2-mNG EsaR titration +/- AHSL" and
  # "EsaO-mNG / [EsaO]2-mNG DNA template titration +/- AHSL" — QC to confirm.
  # No Specification table exists in any of the five source logs.
  title: 'Quorum Sensing in Nucleus Cytosol using EsaO/EsaR Transcriptional Regulation'
  description: >
    Over a 3-week DevStudio collaboration, we optimised the EsaR/EsaO
    quorum-sensing system for use in Nucleus cytosol. Unlike previous
    implementations that co-expressed EsaR alongside the sensor construct,
    we pre-expressed EsaR and added a second EsaO operator to the sensor
    DNA, enabling up to a 5.8-fold change between 'on' and 'off' states.
    Encapsulating the sensor in GUVs produced developer cells that
    detected exogenously added AHSL, a step toward a device for sensing
    contaminated surfaces.
