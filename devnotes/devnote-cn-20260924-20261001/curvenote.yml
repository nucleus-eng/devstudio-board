  title: 'EsaO/R-deGFP AHL Detector'
  description: >
    EsaR(D91G) repression of single- and dual-operator EsaO-mNG sensor
    constructs in Nucleus Cytosol, across four days: an EsaR titration at
    fixed sensor DNA, a sensor DNA titration at fixed EsaR, a repeat of that
    titration with EsaR pre-expressed overnight, and a magnesium sweep with
    EsaR and DNA pre-incubated before the reaction.
