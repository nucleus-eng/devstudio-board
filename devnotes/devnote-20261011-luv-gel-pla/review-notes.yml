- id: main-13
  section: 'GFP-expressing GUVs'
  text: |
    Implementation notes, not for the reader. fig-fov-composite stitches
    the four gel conditions into one image, each well's label as its
    panel header. Each panel is a single z-plane, a centre crop covering
    1/9 of the field's area. Brightfield is blended in at low weight for
    the gel matrix as context.

    GFP contrast is grouped where the two wells' signal levels allow it,
    and kept per-well otherwise. The PEG4Nb pre-gel and gel wells (E14,
    E21) share one stretch, 11864 to 20155 counts, since their GFP
    medians are close. ULGA and LGA (E15, E16) do not share a window:
    E15's whole GFP distribution sits close to E16's ceiling, and
    pooling the two, even with the high percentile raised to 99.99, left
    E15 a near-uniform wash and E16 almost dark. E15 is stretched at
    8405 to 11247 counts, and E16 at 4158 to 7020 counts, each its own
    50th-to-99.9th percentile. See `general/render-microscopy-fovs.py`
    and `figures/fov-render-params.json` for the full method.
