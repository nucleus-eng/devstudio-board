project:
  banner: banner-devcells.webp
  # Title carried from the source Doc's own heading, 2026-10-11.
  title: 'Expressing Cell-Free TetO-GFP in Solution with aTc Titration'
  description: >
    TetR represses the pT7-tetO-plamGFP cell-free reporter to near background
    at 500 and 1000 nM, and a seven-point anhydrotetracycline (aTc)
    titration relieves that repression fully by 5 uM; the amount of TetR
    sets where the induction threshold sits rather than whether the switch
    works.
