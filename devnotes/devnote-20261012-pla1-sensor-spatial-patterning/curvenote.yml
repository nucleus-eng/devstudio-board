  # Title carried from the source Doc's own heading, 2026-10-12.
  title: 'TetO-Regulated PLA1 Sensor in Vesicles: aTc Titration and Spatial Patterning'
  description: >
    A TetO-regulated phospholipase A1 sensor in GUVs runs backward at the
    1-10 uM aTc concentrations usually used for induction, because
    cell-free poisoning, aTc autofluorescence, and membrane partitioning
    all scale with aTc and outweigh the induction they are meant to drive;
    dropping to 0.25 uM recovers the intended behavior and gives a clean,
    spatially confined color change on a patterned hydrogel.
