  # REVIEW: no Specification table in the source Doc. Title unresolved.
  # Candidate title from the Doc's own first line, 2026-10-12: "Implementing
  # of a bulk color change module into bacterial quorum sensing" — QC to
  # confirm, including the phrasing.
  title: ''
  description: >
    A LuxR/lux-box circuit expresses PLA1 in response to AHL, lysing
    dye-loaded storage vesicles inside GUVs and releasing CPRG for cleavage
    by beta-galactosidase, giving a visible color change that distinguishes
    AHL-induced from non-induced conditions within about an hour.
