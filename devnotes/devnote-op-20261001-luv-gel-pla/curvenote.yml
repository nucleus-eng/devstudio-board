  # Title taken from the revised log-devnote-draft.docx, 2026-10-11, which
  # states it on its own first line as "Title: Understanding Liposome
  # Behaviour in Hydrogel Matrices". That is a stated title in the source, so
  # it is adopted here.
  # REVIEW: this replaces 'Embedding Developer Cells in Gels', which came from
  # review cycle v1, prompt 1, on 2026-10-05. That review Doc has since been
  # renamed '[ignore]' in Drive. A third title, 'Study of liposome behaviour in
  # gels', was in the 2026-10-09 version of the same document. Three titles
  # exist across the record. Confirm this one.
  title: 'Understanding Liposome Behaviour in Hydrogel Matrices'
  description: >
    Whether vesicles stay stable and biochemically functional when embedded in
    a hydrogel, where they are mechanically confined and in contact with a
    crosslinked polymer network, read as T7-driven GFP expression in GUVs and
    as CPRG release from LUVs across three hydrogels and a solution control.
