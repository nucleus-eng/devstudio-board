project:
  # Title taken from the "Draft devnote" Doc (1TTuVHZ0Usc0HCjXA6OAVhx5ZKViIi1gN1NrQUtLWx1E)
  # on 2026-10-11, confirmed by Anton. Replaces the chat-supplied working
  # title "LuxR-GFP Sensor Demo".
  title: 'Fluorescent Biofilm-Sensing GUV Hydrogel'
  # Description restates the same Doc's own overview paragraph, updated
  # 2026-10-12 against the Doc's second, authoritative overview pass.
  description: >
    A synthetic-cell hydrogel that senses bacterial contamination through
    quorum-sensing-induced cell-free protein expression: POPC GUVs carrying
    LuxR-mNeonGreen lysate, embedded in agarose, fluorescing in response to
    3-oxo-C6-HSL from purified standard or bacterial supernatant.
