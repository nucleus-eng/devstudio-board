  # Title carried from the source Doc's own heading, 2026-10-11.
  title: 'Triggered Lysis of beta-Galactosidase-Loaded GUVs by Cell-Free Expressed Phospholipase A1'
  description: >
    Phospholipase A1 (PLA1), expressed in a cell-free reaction and placed
    under TetR/anhydrotetracycline control, is delivered to the outside of
    giant unilamellar vesicles loaded with beta-galactosidase to ask
    whether externally supplied PLA1 can lyse the membrane, and whether
    that lysis can be triggered on demand.
