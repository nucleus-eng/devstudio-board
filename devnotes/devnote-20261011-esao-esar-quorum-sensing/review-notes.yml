  section: Testing EsaR-dependent repression of [EsaO]2-mNG DNA in GUVs
  text: |
    , scaled to the 20 µL actually prepared (the log's own component ratios total 10 µL; doubled here per the prose above). This 20 µL recipe is prepared twice, identically — AHSL is not part of either inner solution and is instead added to the outer solution of one of the two preps afterward (see the GUV synthesis steps above). The 4.5 µL "DNA-EsaR mixture" the log records (2.25 µL at the 10 µL basis) is split here into its two components, worked back from the stated final concentrations. The pre-expressed EsaR reaction (24 nM, {numref}`tbl-volumes-20261009-esar`) must contribute 5 × 20/24 = 4.17 µL to reach the stated 5 nM final, leaving 4.5 − 4.17 = 0.33 µL for the reporter DNA. At that volume, hitting the stated 0.1 nM final requires a reporter stock of 0.1 × 20/0.33 = 6.0 nM — 4.0 ng/µL at 663,974.37 g/mol for [EsaO]2-mNG — matching the same reporter DNA stock established in {numref}`tbl-composition-20261007`, independent confirmation that this day reused it.
