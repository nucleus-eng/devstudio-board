  text: " No build file exists for this day (the `build` Sheet in `CN-MB-20261007-EsaR_template_competition` is empty). Final concentrations are calculated from the stock concentrations and volumes the log records; mastermix stocks match the standard cytosol mastermix used throughout this work. \"Pre-expressed EsaR (template DNA carryover)\" is the residual, unreacted EsaR template DNA carried over from the pre-expression step, not EsaR protein — its concentration is reported here in nM DNA, present regardless of condition. The 0.33 µL DNA aliquot is a 1:1 (50:50) mix, split here into its two 0.165 µL halves: Reporter DNA (present in every condition) and either Added EsaR template (+EsaR DNA condition) or Water (−EsaR DNA condition). The reporter's 4 ng/µL stock (the \"2×\" stock the log refers to) was supplied by the author, not stated in the log excerpt itself; at 663,974.37 g/mol for [EsaO]2-mNG, 4 ng/µL diluted 0.165/10 into the full reaction gives 0.099 nM — matching the stated 0.1\
