  text: " No build file exists for this day; final concentrations are calculated from the stock concentrations and volumes the log records. The EsaR DNA Template stock (320 nM) is the same raw-PCR stock used in {numref}`tbl-composition-20261007`; its concentration cannot have changed, so \"double the 12 nM used previously\" is achieved by doubling the pipetted volume (0.375 µL for 12 nM, 0.75 µL for 24 nM here), not by a more concentrated stock. The log's own \"EsaR DNA 0.15\" row does not reflect this — 0.15 µL is the same boilerplate DNA volume used throughout this work's other protocols, so it looks like a copy-paste error rather than this day's actual pipetted volume. Water is adjusted here to keep the 10 µL total, but the exact total this day used is not independently confirmed. The log also lists an AHSL row in this pre-expression-only reaction — no reporter construct is present yet, so it has no obvious function here; carried verbatim from the log, not corrected or explained further.\
    \ \n"
