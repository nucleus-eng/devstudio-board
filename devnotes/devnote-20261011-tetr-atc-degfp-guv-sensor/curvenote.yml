  # Title carried from the source Doc's own heading, 2026-10-11. The previous
  # value, "aTc Sensor", was set by hand on 2026-10-04 before the Doc existed.
  title: 'GUV Encapsulation of a TetR/aTc-Inducible deGFP Cell-Free Sensor'
  description: >
    A TetR-repressed, anhydrotetracycline-inducible deGFP cell-free reaction is
    encapsulated in giant unilamellar vesicles by inverted emulsion transfer,
    and its dose-response is read by fluorescence microscopy against a matched
    unencapsulated plate reader control.
