version: 1
project:
  banner: banner-devcells.webp
  # Title supplied by Anton, 2026-10-12, replacing "Fluorescent
  # Biofilm-Sensing GUV Hydrogel" (itself taken from the "Draft devnote" Doc,
  # 1TTuVHZ0Usc0HCjXA6OAVhx5ZKViIi1gN1NrQUtLWx1E, on 2026-10-11). No source Doc
  # carries this new title; it did not come from the Doc this time.
  title: 'Bacterial Sensing in Hydrogel Embedded Synthetic Cells using LuxR Dependent Transcriptional Regulation'
  # Description restates the Doc's own overview paragraph as of 2026-10-12.
  # Not re-derived from the new title, which this description predates.
  description: >
    A synthetic-cell hydrogel that senses bacterial contamination through
    quorum-sensing-induced cell-free protein expression: POPC GUVs carrying
    LuxR-mNeonGreen lysate, embedded in agarose, fluorescing in response to
    3-oxo-C6-HSL from purified standard or bacterial supernatant.
