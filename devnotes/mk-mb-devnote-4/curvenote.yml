version: 1
project:
  # Title carried from the source Doc's own heading, 2026-10-12.
  title: 'Co-Encapsulated Cell-Free PLA1 Expression in beta-Galactosidase GUVs'
  description: >
    Co-encapsulating a complete cell-free reaction with beta-galactosidase
    inside GUVs shows that protein expression itself, not phospholipase
    activity, drives loss of membrane containment; a follow-up experiment
    confirms the effect is graded and controlled by expression level via
    TetR/aTc, independent of which protein is made.
