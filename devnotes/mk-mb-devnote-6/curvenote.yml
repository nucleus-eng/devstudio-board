  # Title taken from the Drive file's own name, 2026-10-21: the source Doc
  # has no title heading or byline block at all.
  title: 'Double Vesicle Lysis System Leveraging deGFP CFPE'
  description: >
    Splitting a cell-free lysis assay's expression and reporter components
    into two separately formed GUV populations, combined only in a shared
    hydrogel, isolates a PLA1-specific signal that expression alone cannot
    explain -- unlike the earlier co-encapsulated design, where expression
    itself was sufficient to drive the readout.
